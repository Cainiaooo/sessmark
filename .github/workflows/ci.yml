name: test
on: [push, pull_request]
jobs:
  test:
    strategy:
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
        python: ['3.11', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[ui,dev]" -e adapters/herdr
      - run: python -m pytest -q
      - run: ruff check src tests adapters/herdr/src adapters/herdr/tests plugins/herdr conftest.py
      - run: python -m build
      - run: python -m build adapters/herdr
